<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>WindowsClockWidget Önizleme v2</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
        flex-wrap: wrap;
        font-family: "Segoe UI", sans-serif;
        background:
            radial-gradient(circle at 20% 30%, #3b5e8c 0%, transparent 50%),
            radial-gradient(circle at 80% 70%, #6b4a8c 0%, transparent 50%),
            linear-gradient(135deg, #1a1f35 0%, #2d1f45 100%);
    }

    .panel {
        width: 240px;
        padding: 18px;
        border-radius: 12px;
        background: rgba(255,255,255,.08);
        backdrop-filter: blur(8px);
        color: #fff;
        font-size: 13px;
    }
    .panel label { display: block; margin: 10px 0 2px; color: #ffffffcc; }
    .panel input[type=text], .panel select {
        width: 100%; height: 28px; border: none; border-radius: 6px;
        padding: 0 8px; background: #fff; color: #1f1e1d;
    }
    .panel input[type=range] { width: 100%; accent-color: #7aa7ff; }
    .panel button {
        margin-top: 14px; width: 100%; height: 32px; border: none;
        border-radius: 6px; background: #fff; color: #1f1e1d;
        font-weight: 600; cursor: pointer;
    }
    .val { float: right; color: #9db4ff; }

    /* ===== Widget ===== */
    .widget {
        --opacity: 85;
        width: 440px; height: 210px;
        border-radius: 14px;
        position: relative;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        padding: 16px 24px;
        color: #1F1E1D;
        box-shadow: 0 4px 18px rgba(0,0,0,.30);
        background: linear-gradient(135deg,
            rgba(255,255,255,var(--o1)) 0%,
            rgba(245,245,246,var(--o2)) 100%);
    }

    .time {
        font-size: var(--clock-size);
        font-weight: 300;
        line-height: 1;
        letter-spacing: -2px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }

    .right {
        display: flex; flex-direction: column;
        align-items: flex-end; align-self: stretch;
        padding-top: 6px;
    }
    .date { font-size: 15px; }

    .weather {
        margin-top: auto;
        display: flex; align-items: center; gap: 8px;
        text-align: right;
    }
    .w-icon { font-size: 30px; line-height: 1; }
    .temp { font-size: 22px; font-weight: 600; }
    .desc { font-size: 11px; opacity: .75; }

    .corner {
        position: absolute; top: 10px; right: 14px;
        display: flex; gap: 4px;
    }
    .corner div {
        width: 22px; height: 22px; border-radius: 4px;
        display: grid; place-items: center;
        font-family: "Segoe MDL2 Assets";
        font-size: 10px; opacity: .45; cursor: pointer;
    }
    .corner div:hover { background: rgba(0,0,0,.12); opacity: 1; }
</style>
</head>
<body>

<div class="widget" id="widget">
    <div class="corner">
        <div title="Ayarlar">&#xE713;</div>
        <div title="Kapat">&#xE8BB;</div>
    </div>

    <div class="time" id="clock">--:--</div>

    <div class="right">
        <div class="date" id="date"></div>
        <div class="weather">
            <div class="w-icon" id="wicon">&#x2601;</div>
            <div>
                <div class="temp" id="temp">--°</div>
                <div class="desc" id="desc">yükleniyor…</div>
            </div>
        </div>
    </div>
</div>

<div class="panel">
    <b>Ayarlar (önizleme)</b>

    <label>Yazı tipi</label>
    <select id="fontSel">
        <option value='"Segoe UI", sans-serif' selected>Segoe UI</option>
        <option value='"Segoe UI Light", "Segoe UI", sans-serif'>Segoe UI Light</option>
        <option value='Consolas, monospace'>Consolas</option>
        <option value='Georgia, serif'>Georgia</option>
        <option value='"Courier New", monospace'>Courier New</option>
        <option value='Arial, sans-serif'>Arial</option>
    </select>

    <label>Saat boyutu <span class="val" id="sizeVal">96 pt</span></label>
    <input type="range" id="sizeSlider" min="48" max="140" step="2" value="96">

    <label>Arka plan saydamlığı <span class="val" id="opVal">%85</span></label>
    <input type="range" id="opSlider" min="0" max="100" value="85">

    <label>Şehir</label>
    <input type="text" id="cityInput" value="İstanbul">

    <button onclick="loadWeather()">Hava Durumunu Getir</button>
</div>

<script>
/* ---------- Saat ---------- */
const gunler = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const aylar = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

function tick() {
    const n = new Date(), p = v => String(v).padStart(2, "0");
    document.getElementById("clock").textContent = `${p(n.getHours())}:${p(n.getMinutes())}`;
    document.getElementById("date").textContent =
        `${n.getDate()} ${aylar[n.getMonth()]} ${n.getFullYear()} ${gunler[n.getDay()]}`;
}
tick(); setInterval(tick, 1000);

/* ---------- Ayarlar ---------- */
const widget = document.getElementById("widget");
document.getElementById("sizeSlider").oninput = e => {
    const v = +e.target.value;
    document.getElementById("sizeVal").textContent = v + " pt";
    widget.style.setProperty("--clock-size", v * (440 / 420) + "px"); // WPF pt -> px yaklaşık
};
document.getElementById("opSlider").oninput = e => {
    const v = +e.target.value;
    document.getElementById("opVal").textContent = "%" + v;
    widget.style.setProperty("--o1", v / 100);
    widget.style.setProperty("--o2", Math.min(1, v / 100 + .04));
};
document.getElementById("fontSel").onchange = e =>
    document.getElementById("clock").style.fontFamily = e.target.value;

/* ---------- Hava durumu: Open-Meteo (gerçek API) ---------- */
const kodlarTR = c => ({0:"Açık",1:"Az bulutlu",2:"Parçalı bulutlu",3:"Kapalı",45:"Puslu",48:"Puslu",
    51:"Çisenti",53:"Çisenti",55:"Çisenti",61:"Yağmurlu",63:"Yağmurlu",65:"Yağmurlu",
    71:"Karlı",73:"Karlı",75:"Karlı",80:"Sağanak",81:"Sağanak",82:"Sağanak",
    95:"Gök gürültülü",96:"Dolulu fırtına"}[c] || "Bilinmiyor");

const ikon = c => c===0 ? "\u2600" : (c===1||c===2) ? "\u26C5" : (c>=51&&c<=67)||(c>=80&&c<=82) ? "\u2614"
    : (c>=71&&c<=77)||c===85||c===86 ? "\u2744" : c>=95 ? "\u26A1" : "\u2601";

async function loadWeather() {
    const city = document.getElementById("cityInput").value.trim();
    if (!city) return;
    try {
        const g = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=tr`).then(r => r.json());
        const loc = g.results?.[0];
        if (!loc) throw 0;

        const w = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m,weather_code`).then(r => r.json());
        document.getElementById("temp").textContent = Math.round(w.current.temperature_2m) + "°";
        document.getElementById("desc").textContent = kodlarTR(w.current.weather_code);
        document.getElementById("wicon").textContent = ikon(w.current.weather_code);
    } catch {
        document.getElementById("desc").textContent = "şehir bulunamadı";
    }
}
loadWeather();
setInterval(loadWeather, 15 * 60 * 1000);
</script>

</body>
</html>
